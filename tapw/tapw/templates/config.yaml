# TAPW single-case configuration

system:
  output: outputs
  structure: POSCAR
  hamiltonian: H.npz
  overlap: S.npz
  orbitals: {Mo: s3p2d1, Te: s3p2d2}
  twist_index: 3
  layers: [1, 1]
  spin: true

bands:
  valley: K1
  q_shell: 6
  efermi: -4.6
  num_processes: 61
  blas_threads: 4
  num_bands: 100
  save_hamiltonian: true
  save_wavefunctions: false
  kpath:
    labels: [G, M, K, G]
    points_per_segment: 40
    coordinates:
      G: [0.0, 0.0]
      M: [0.5, 0.0]
      K: [0.3333333333, 0.3333333333]

symmetry:
  valley: K1
  q_shell: 6
  efermi: -4.6
  tolerance: 2.0e-2
  spglib_symprec: 5.0e-2
  num_bands: 100
  developer_outputs: false
  debug: false
  representation:
    points:
      G: [0.0, 0.0]
      M: [0.5, 0.0]
      K: [0.3333333333, 0.3333333333]
    degeneracy_tol: 2.0e-3

topology:
  valley: K1
  q_shell: 6
  efermi: -4.6
  num_processes: 61
  num_bands: 100
  save_wavefunctions: true

  mesh:
    n_b1: 31
    n_b2: 31
    range_b1: [-0.5, 0.5]
    range_b2: [-0.5, 0.5]

  bands:
    vbm2:
      sector: valence
      indices: [-1, -2]
    cbm2:
      sector: conduction
      indices: [0, 1]

  berry_curvature:
    - bands: vbm2
  quantum_geometry:
    - bands: vbm2
  wcc:
    - bands: vbm2
      loop: b2

field:
  zero_potential_layers: [1]
  electric_field_eVpA: 0.0
  inner_symmetric: false
