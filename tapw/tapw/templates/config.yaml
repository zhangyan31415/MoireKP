# TAPW single-case configuration

case:
  name: K1_q06
  output_root: outputs

twist:
  bravais: hex
  twist_index_m: 3
  twist_layer: [1, 1]
  spin: true

paths:
  H_file: H.dat
  S_file: S.dat
  input_file: openmx.dat
  kpath_in: KPATH_GMKG.in

bands:
  enable: true
  valley: K1
  q_shell: 6
  efermi: -4.6
  num_processes: 61
  blas_threads: 4
  num_bands: 100
  save_hamiltonian: true
  save_wavefunctions: false

symmetry:
  enable: false
  valley: K1
  q_shell: 6
  tolerance: 2.0e-2
  spglib_symprec: 5.0e-2
  developer_outputs: false
  debug: false

topology:
  enable: false
  valley: K1
  q_shell: 6
  efermi: -4.6
  num_processes: 61
  num_bands: 100
  save_wavefunctions: true

  mesh:
    n_b1: 31
    n_b2: 31
    range_b1: [-0.5, 0.5]
    range_b2: [-0.5, 0.5]

  bandsets:
    vbm2:
      sector: valence
      indices: [-1, -2]
    cbm2:
      sector: conduction
      indices: [0, 1]

  observables:
    berry_curvature: [vbm2]
    quantum_geometry: [vbm2]
    wcc:
      - bands: vbm2
        loop: b2

field:
  zero_potential_layers: [1]
  electric_field_eVpA: 0.0
  inner_symmetric: false
