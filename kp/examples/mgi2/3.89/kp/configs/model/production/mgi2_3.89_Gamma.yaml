source_config: ../../source/mgi2_3.89_Gamma.yaml
validation:
  allow_missing_wavefunction_overlap: true
  reason: wavefunction/projector overlap is not exported by the current Gamma configured
    pipeline
valley_model:
  lattice: hexagonal
  system: bilayer
  valley_type: Gamma
  mode: single_valley
  active_valleys:
  - Gamma
  spin_convention: spinful
  allowed_internal_symmetries:
  - C3z
  - TR
  - C2
  external_sewing_symmetries: []
symmetry_source:
  type: kp_symm_output
  use: raw
  matrix_kind: representation
  operations:
  - C3z
  - C2
  - TR
kpath:
  file: ../../../../tapw/KPATH.in
  tmat:
  - - 60.9508659523
    - 0.0
    - 0.0
  - - -30.4754329751
    - 52.7849982976
    - 0.0
  - - 0.0
    - 0.0
    - 50.0
model:
  bM:
    infer_from_q: true
    angle_deg: 60
  harmonics:
    intra: 4
    inter: 4
  max_order:
    Kinect: 10
    intra: 6
    inter: 10
  symmetry_map:
    Kinect:
    - C3z
    - TR
    - C2
    Onsite:
    - C3z
    - TR
    - C2
    intra:
    - C3z
    - TR
    - C2
    inter:
    - C3z
    - TR
    - C2
fit:
  indices:
  - 0
  - 40
  coeff_tol: 1.0e-06
bands:
  compare_to_heff: true
  band_slice:
  - 0
  - 124
  plot:
    top_bands: 4
    align: top
output:
  dir: ../../../outputs/model/production/mgi2_3.89_Gamma
  save_coefficients: true
  verbose: false
  progress: true
