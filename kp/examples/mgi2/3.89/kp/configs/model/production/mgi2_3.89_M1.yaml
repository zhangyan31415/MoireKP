source_config: ../../source/mgi2_3.89_M1.yaml
validation:
  allow_missing_wavefunction_overlap: true
  reason: M1 is currently validated as an effective-interim closure without projector-overlap
    export
valley_model:
  lattice: hexagonal
  system: bilayer
  valley_type: M
  mode: single_valley
  active_valleys:
  - M1
  spin_convention: spinless_effective
  allowed_internal_symmetries:
  - TR_eff
  - C2_eff
  external_sewing_symmetries: []
symmetry_source:
  type: toy_generator
  allow: true
  basis_template: M_spinless_layer_exchange
coordinate_frame:
  rotation_deg: 210
sectors:
- name: bottom
  qset: qset1
  q_offset:
  - 0.0
  - 0.0
  n_orb: 1
- name: top
  qset: qset2
  q_offset:
  - 0.0
  - 0.0
  n_orb: 1
kpath:
  file: ../../../../tapw/KPATH.in
  tmat:
  - - 60.9508659523
    - 0.0
    - 0.0
  - - -30.4754329751
    - 52.7849982976
    - 0.0
  - - 0.0
    - 0.0
    - 50.0
model:
  n_orb:
  - 1
  - 1
  bM:
    source: tmat
    angle_deg: 60
  harmonics:
    intra: 6
    inter: 5
  max_order:
    Kinect: 10
    intra: 6
    inter: 8
  symmetry_map:
    Kinect:
    - C2_eff
    - TR_eff
    Onsite:
    - C2_eff
    - TR_eff
    intra:
    - C2_eff
    - TR_eff
    inter:
    - C2_eff
    - TR_eff
fit:
  indices:
  - 20
  - 40
  coeff_tol: 1.0e-06
bands:
  compare_to_heff: true
  band_slice:
  - 0
  - 8
  plot:
    bottom_bands: 8
    align: bottom
    figsize:
    - 3.2
    - 5.8
    ylim:
    - 0.0
    - 0.16
output:
  dir: ../../../outputs/model/production/mgi2_3.89_M1
  save_coefficients: true
  verbose: false
  progress: true
