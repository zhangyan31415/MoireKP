source_config: ../../source/mgi2_3.89_M1.yaml
validation:
  allow_missing_wavefunction_overlap: true
  reason: M1 is currently validated as an effective-interim closure without projector-overlap
    export
valley_model:
  lattice: hexagonal
  system: bilayer
  valley_type: M
  mode: single_valley
  active_valleys:
  - M1
  spin_convention: spinless_effective
  allowed_internal_symmetries:
  - TR_eff
  - C2_eff
  external_sewing_symmetries: []
symmetry_source:
  type: toy_generator
  allow: true
  basis_template: M_spinless_layer_exchange
coordinate_frame:
  rotation_deg: 210
sectors:
- name: bottom
  qset: qset1
  q_offset:
  - 0.0
  - 0.0
  n_orb: 1
- name: top
  qset: qset2
  q_offset:
  - 0.0
  - 0.0
  n_orb: 1
kpath:
  file: ../../../../tapw/KPATH.in
  tmat:
  - - 60.9508659523
    - 0.0
    - 0.0
  - - -30.4754329751
    - 52.7849982976
    - 0.0
  - - 0.0
    - 0.0
    - 50.0
model:
  n_orb:
  - 1
  - 1
  bM:
    source: tmat
    angle_deg: 60
  vectors:
    q1: '[0.5 * bM_norm, 0.0]'
  harmonics:
    intra:
      1: bM1
      2: bM2
      3: -bM1 + bM2
      4: bM1 + bM2
      5: -2*bM1 + bM2
      6: 2*bM1
    inter:
      1: q1
      3: bM2 - q1
      5: bM2 + q1
      7: bM1 + q1
      8: bM2 - 3*q1
  max_order:
    Kinect: 10
    intra: 6
    inter: 8
  term_templates:
  - name: kinetic_bottom
    source: diagonal_kp
    sector_pairs:
    - - bottom
      - bottom
    orbital_pairs: diagonal
    max_order: 10
  - name: onsite_bottom
    source: onsite
    sector_pairs:
    - - bottom
      - bottom
    orbital_pairs: diagonal
    max_order: 0
  - name: intra_bottom
    source: moire_potential
    sector_pairs:
    - - bottom
      - bottom
    orbital_pairs: all
    harmonics: intra
    max_order: 6
  - name: inter_top_to_bottom
    source: tunneling
    sector_pairs:
    - - top
      - bottom
    orbital_pairs: all
    harmonics: inter
    max_order: 8
  symmetry_map:
    Kinect:
    - name: C2_eff
    - name: TR_eff
    Onsite:
    - name: C2_eff
    - name: TR_eff
    intra:
    - name: C2_eff
    - name: TR_eff
    inter:
    - name: C2_eff
    - name: TR_eff
fit:
  indices:
  - 20
  - 40
  coeff_tol: 1.0e-06
bands:
  compare_to_heff: true
  band_slice:
  - 0
  - 8
  plot:
    bottom_bands: 8
    align: bottom
    figsize:
    - 3.2
    - 5.8
    ylim:
    - 0.0
    - 0.16
output:
  dir: ../../../outputs/model/production/mgi2_3.89_M1
  save_coefficients: true
  verbose: false
  progress: true
