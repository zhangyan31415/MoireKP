source_config: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/kp/outputs/symm/mgi2_3.89_M1_spinful_symm_config.yaml
validation:
  allow_missing_wavefunction_overlap: true
  reason: M1 pipeline is an effective-interim closure without projector-overlap export
heff_file: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/kp/outputs/project/mgi2_3.89_M1_spinful/heff_list.npy
coordinate_frame:
  rotation_deg: 210.0
valley_model:
  lattice: hexagonal
  system: bilayer
  valley_type: M
  mode: single_valley
  active_valleys:
  - M1
  spin_convention: spinful
  allowed_internal_symmetries:
  - TR
  - C2
  external_sewing_symmetries: []
symmetry_source:
  type: kp_symm_output
  path: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/kp/outputs/symm/mgi2_3.89_M1_spinful
  use: raw
  matrix_kind: action
  operations:
  - name: TR
    operation: T
    matrix_file: T_low_raw.npy
    antiunitary: true
    k_map:
      type: negation
    q_map:
      type: negation
    sector_map: identity
    source_matrix_role: raw_h_sewing_action
    source_gauge: raw_saved_TAPW
    target_role: continuum_internal_rep
    gauge_correction:
      kind: none
    antiunitary_convention: U_K
    spin_map: from_kp_symm_output
    valley_map: identity
  - name: C2
    operation: C2
    matrix_file: C2_low_raw.npy
    antiunitary: false
    k_map:
      type: reflection
      axis_deg: 150.0
    q_map:
      type: reflection
      axis_deg: 150.0
    sector_map: identity
    source_matrix_role: raw_h_sewing_action
    source_gauge: raw_saved_TAPW
    target_role: continuum_internal_rep
    gauge_correction:
      kind: none
    antiunitary_convention: none
    spin_map: from_kp_symm_output
    valley_map: identity
  exactification:
    support_source: geometry
    reject_if_off_support_rel_gt: 1.0e-05
    reject_if_amplitude_deviation_gt: 0.05
    operations:
      TR:
        support_mode: block
        power: 2
        central_phase: -1
        action_candidates:
        - k_map:
            type: negation
            in_model_frame: true
          q_map:
            type: negation
          sector_map: identity
          antiunitary: true
      C2:
        support_mode: block_monomial
        power: 2
        central_phase: -1
        allowed_roots: sixth_roots
        monomial_phase_classes: matrix_element
        monomial_cleanup_tol: 1.0e-5
        action_candidates:
        - k_map:
            type: reflection
            axis_deg: 0.0
            in_model_frame: true
          q_map:
            type: reflection
            axis_deg: 0.0
          sector_map: layer_exchange
          antiunitary: false
kpath:
  file: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/tapw/KPATH.in
  tmat:
  - - 60.9508659523
    - 0.0
    - 0.0
  - - -30.4754329751
    - 52.7849982976
    - 0.0
  - - 0.0
    - 0.0
    - 50.0
sectors:
- name: bottom
  qset: qset1
  n_orb: 2
- name: top
  qset: qset2
  n_orb: 2
model:
  n_orb:
  - 2
  - 2
  bM:
    source: tmat
    angle_deg: 60
  vectors:
    q1: '[0.5 * bM_norm, 0.0]'
  harmonics:
    intra:
      1: bM1
      2: bM2
      3: -bM1 + bM2
      4: bM1 + bM2
      5: -2*bM1 + bM2
      6: 2*bM1
    inter:
      1: q1
      3: bM2 - q1
      5: bM2 + q1
  max_order:
    Kinect: 10
    intra: 6
    inter: 8
  term_templates:
  - name: m1_kinetic_bottom
    source: diagonal_kp
    sector_pairs:
    - - bottom
      - bottom
    orbital_pairs: diagonal
    max_order: 10
  - name: m1_onsite_bottom
    source: onsite
    sector_pairs:
    - - bottom
      - bottom
    orbital_pairs: diagonal
    max_order: 0
  - name: m1_intra_bottom
    source: moire_potential
    sector_pairs:
    - - bottom
      - bottom
    orbital_pairs: all
    harmonics: intra
    max_order: 6
    harmonics_source: symmetry_representatives
  - name: m1_inter_top_to_bottom
    source: tunneling
    sector_pairs:
    - - top
      - bottom
    orbital_pairs: all
    harmonics: inter
    max_order: 8
    harmonics_source: symmetry_representatives
  symmetry_map:
    Kinect:
    - name: C2
    - name: TR
    Onsite:
    - name: C2
    - name: TR
    intra:
    - name: C2
    - name: TR
    inter:
    - name: C2
    - name: TR
  nlow_state:
  - 2
  - 2
fit:
  indices:
  - 0
  - 20
  - 40
  - 60
  coeff_tol: 1.0e-06
bands:
  compare_to_heff: true
  band_slice:
  - 0
  - 16
  plot:
    bottom_bands: 8
    align: bottom
    figsize:
    - 3.0
    - 5.8
    num_bands: 16
output:
  dir: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/kp/runs/release/mgi2_3.89_M1_spinful
  save_coefficients: true
  verbose: false
  progress: true
heff_eig_file: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/kp/outputs/project/mgi2_3.89_M1_spinful/heff_eig.npy
