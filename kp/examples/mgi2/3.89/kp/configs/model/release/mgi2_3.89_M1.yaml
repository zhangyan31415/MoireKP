source_config: ../../source/mgi2_3.89_M1.yaml
validation:
  allow_missing_wavefunction_overlap: true
  reason: M1 pipeline is an effective-interim closure without projector-overlap export
heff_file: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/kp/outputs/project/mgi2_3.89_M1/heff_list.npy
coordinate_frame:
  rotation_deg: 210.0
valley_model:
  lattice: hexagonal
  system: bilayer
  valley_type: M
  mode: single_valley
  active_valleys:
  - M1
  spin_convention: spinless_effective
  allowed_internal_symmetries:
  - TR_eff
  - C2_eff
  external_sewing_symmetries: []
symmetry_source:
  type: kp_symm_output
  path: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/kp/outputs/symm/mgi2_3.89_M1
  use: raw
  matrix_kind: action
  operations:
  - TR_eff
  - C2_eff
  effective_interpretation: single-spin M1 effective operators derived from TAPW TR/C2
    sewing output
  exactification:
    support_source: geometry
    central_phase:
      TR_eff^2: 1
      C2_eff^2: 1
    phase_classes: global
    reject_if_off_support_rel_gt: 1.0e-05
    reject_if_amplitude_deviation_gt: 0.05
kpath:
  file: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/tapw/KPATH.in
  tmat:
  - - 60.9508659523
    - 0.0
    - 0.0
  - - -30.4754329751
    - 52.7849982976
    - 0.0
  - - 0.0
    - 0.0
    - 50.0
sectors:
- name: bottom
  qset: qset1
  n_orb: 1
- name: top
  qset: qset2
  n_orb: 1
model:
  n_orb:
  - 1
  - 1
  bM:
    source: tmat
    angle_deg: 60
  harmonics:
    intra: 6
    inter: 3
  max_order:
    Kinect: 10
    intra: 6
    inter: 8
  symmetry_map:
    Kinect:
    - C2_eff
    - TR_eff
    Onsite:
    - C2_eff
    - TR_eff
    intra:
    - C2_eff
    - TR_eff
    inter:
    - C2_eff
    - TR_eff
fit:
  indices:
  - 20
  - 40
  coeff_tol: 1.0e-06
bands:
  compare_to_heff: true
  band_slice:
  - 0
  - 8
  plot:
    bottom_bands: 8
    align: bottom
    figsize:
    - 3.0
    - 5.8
output:
  dir: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/kp/runs/release/mgi2_3.89_M1
  save_coefficients: true
  verbose: false
  progress: true
