source_config: ../../source/mgi2_3.89_M1.yaml
validation:
  allow_missing_wavefunction_overlap: true
  reason: M1 pipeline is an effective-interim closure without projector-overlap export
heff_file: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/kp/outputs/project/mgi2_3.89_M1/heff_list.npy
coordinate_frame:
  rotation_deg: 210.0
valley_model:
  lattice: hexagonal
  system: bilayer
  valley_type: M
  mode: single_valley
  active_valleys:
  - M1
  spin_convention: spinless_effective
  allowed_internal_symmetries:
  - TR_eff
  - C2_eff
  external_sewing_symmetries: []
symmetry_source:
  type: kp_symm_output
  path: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/kp/outputs/symm/mgi2_3.89_M1
  use: raw
  matrix_kind: action
  operations:
  - name: TR_eff
    operation: TR
    matrix_file: T_low_raw.npy
    antiunitary: true
    k_map:
      type: negation
    q_map:
      type: negation
    sector_map: identity
    source_matrix_role: raw_h_sewing_action
    source_gauge: raw_saved_TAPW
    target_role: continuum_internal_rep
    gauge_correction:
      kind: none
    spin_map: from_kp_symm_output
    valley_map: identity
    antiunitary_convention: U_K
  - name: C2_eff
    operation: C2
    matrix_file: C2_low_raw.npy
    antiunitary: false
    k_map:
      type: reflection
      axis_deg: 0.0
    q_map:
      type: reflection
      axis_deg: 0.0
    sector_map: layer_exchange
    source_matrix_role: raw_h_sewing_action
    source_gauge: raw_saved_TAPW
    target_role: continuum_internal_rep
    gauge_correction:
      kind: none
    spin_map: from_kp_symm_output
    valley_map: identity
    antiunitary_convention: none
  effective_interpretation: single-spin M1 effective operators derived from TAPW TR/C2
    sewing output
  exactification:
    support_source: geometry
    central_phase:
      TR_eff^2: 1
      C2_eff^2: 1
    phase_classes: global
    reject_if_off_support_rel_gt: 1.0e-05
    reject_if_amplitude_deviation_gt: 0.05
kpath:
  file: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/tapw/KPATH.in
  tmat:
  - - 60.9508659523
    - 0.0
    - 0.0
  - - -30.4754329751
    - 52.7849982976
    - 0.0
  - - 0.0
    - 0.0
    - 50.0
sectors:
- name: bottom
  qset: qset1
  n_orb: 1
- name: top
  qset: qset2
  n_orb: 1
model:
  n_orb:
  - 1
  - 1
  bM:
    source: tmat
    angle_deg: 60
  harmonics:
    intra: 6
    inter: 3
  max_order:
    Kinect: 10
    intra: 6
    inter: 8
  symmetry_map:
    Kinect:
    - name: C2_eff
      antiunitary: false
      k_map:
        type: reflection
        axis_deg: 0.0
      q_map:
        type: reflection
        axis_deg: 0.0
      sector_map: layer_exchange
      user_name: C2_eff
    - name: TR_eff
      antiunitary: true
      k_map:
        type: negation
      q_map:
        type: negation
      sector_map: identity
      user_name: TR_eff
    Onsite:
    - name: C2_eff
      antiunitary: false
      k_map:
        type: reflection
        axis_deg: 0.0
      q_map:
        type: reflection
        axis_deg: 0.0
      sector_map: layer_exchange
      user_name: C2_eff
    - name: TR_eff
      antiunitary: true
      k_map:
        type: negation
      q_map:
        type: negation
      sector_map: identity
      user_name: TR_eff
    intra:
    - name: C2_eff
      antiunitary: false
      k_map:
        type: reflection
        axis_deg: 0.0
      q_map:
        type: reflection
        axis_deg: 0.0
      sector_map: layer_exchange
      user_name: C2_eff
    - name: TR_eff
      antiunitary: true
      k_map:
        type: negation
      q_map:
        type: negation
      sector_map: identity
      user_name: TR_eff
    inter:
    - name: C2_eff
      antiunitary: false
      k_map:
        type: reflection
        axis_deg: 0.0
      q_map:
        type: reflection
        axis_deg: 0.0
      sector_map: layer_exchange
      user_name: C2_eff
    - name: TR_eff
      antiunitary: true
      k_map:
        type: negation
      q_map:
        type: negation
      sector_map: identity
      user_name: TR_eff
fit:
  indices:
  - 20
  - 40
  coeff_tol: 1.0e-06
bands:
  compare_to_heff: true
  band_slice:
  - 0
  - 8
  plot:
    bottom_bands: 8
    align: bottom
    figsize:
    - 3.0
    - 5.8
output:
  dir: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/kp/runs/release/mgi2_3.89_M1
  save_coefficients: true
  verbose: false
  progress: true
