# Public-facing example config draft for the MgI2 3.89 M1 effective-interim path.
# This file is intentionally concise and user-oriented.
# It is organized around the physical inputs to the continuum model.

system:
  material: MgI2
  twist_angle_deg: 3.89
  valley: M1
  spin: up

inputs:
  heff: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/kp/outputs/project/mgi2_3.89_M1/heff_list.npy
  qset:
    layer1: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/tapw/Q_shell_7/g_vec_list_7_M1_1layer.npy
    layer2: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/tapw/Q_shell_7/g_vec_list_7_M1_2layer.npy
  kpath: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/tapw/KPATH.in
  symmetry: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/tapw/symmetry_analysis_test_m_q7
  band_reference: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/tapw/Q_shell_7/band/band_CBM_M1_valley.txt

geometry:
  tmat:
    - [60.9508659523, 0.0, 0.0]
    - [-30.4754329751, 52.7849982976, 0.0]
    - [0.0, 0.0, 50.0]
  rotation_deg: 210

basis:
  n_orb: [1, 1]

fit:
  points: [20, 40]

terms:
  kinetic:
    order: 10

  onsite:
    enabled: true

  intra:
    order: 6
    harmonics: 6

  inter:
    order: 8
    harmonics: 5

bands:
  compare_to_heff: true
  window: bottom8

output:
  run_dir: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/kp/runs/mgi2_3.89_M1_public
