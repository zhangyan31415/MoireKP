# Public-facing example config draft for the MgI2 3.89 Gamma release path.
# This file is intentionally concise and user-oriented.
# It is organized around the physical inputs to the continuum model.

system:
  material: MgI2
  twist_angle_deg: 3.89
  valley: Gamma
  spin: all

inputs:
  heff: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/kp/outputs/project/mgi2_3.89_Gamma_formal/heff_list.npy
  qset:
    layer1: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/tapw/Q_shell_5_symm/g_vec_list_5_Gamma_1layer.npy
    layer2: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/tapw/Q_shell_5_symm/g_vec_list_5_Gamma_2layer.npy
  kpath: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/tapw/KPATH.in
  symmetry: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/kp/outputs/symm/mgi2_3.89_Gamma_formal
  band_reference: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/tapw/Q_shell_5_symm/band/band_VBM_Gamma_valley.txt

geometry:
  tmat:
    - [60.9508659523, 0.0, 0.0]
    - [-30.4754329751, 52.7849982976, 0.0]
    - [0.0, 0.0, 50.0]
  rotation_deg: 210

basis:
  n_orb: [2, 2]

fit:
  points: [0, 40]

terms:
  kinetic:
    order: 10

  onsite:
    enabled: true

  intra:
    order: 6
    harmonics: 4

  inter:
    order: 6
    harmonics: 4

bands:
  compare_to_heff: true
  window: top4

output:
  run_dir: /data/work/zy/software/1.tapw_code/moirekp/kp/examples/mgi2/3.89/kp/runs/mgi2_3.89_Gamma_public
