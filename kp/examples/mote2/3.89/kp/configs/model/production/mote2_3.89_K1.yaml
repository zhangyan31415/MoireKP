source_config: ../../source/mote2_3.89_K1.yaml
validation:
  allow_missing_wavefunction_overlap: true
  reason: K1 production currently validates Hamiltonian/symmetry numerics without
    exported projector-overlap data
valley_model:
  lattice: hexagonal
  system: bilayer
  valley_type: K
  mode: single_valley
  active_valleys:
  - K1
  spin_convention: spin_up_only
  allowed_internal_symmetries:
  - C3z
  - C2T
  external_sewing_symmetries: []
symmetry_source:
  type: kp_symm_output
  path: ../../../outputs/symm/mote2_3.89_K1
  use: raw
  matrix_kind: action
  operations:
  - name: C3z
    operation: C3
    matrix_file: C3_low_raw.npy
    antiunitary: false
    k_map:
      type: rotation
      angle_deg: 120.0
    q_map:
      type: rotation
      angle_deg: 120.0
    sector_map: identity
    source_matrix_role: raw_h_sewing_action
    source_gauge: raw_saved_TAPW
    target_role: continuum_internal_rep
    gauge_correction:
      kind: none
    antiunitary_convention: none
    spin_map: from_kp_symm_output
    valley_map: identity
  - name: C2T
    operation: C2T
    matrix_file: C2T_low_raw.npy
    antiunitary: true
    k_map:
      type: reflection
      axis_deg: 180.0
    q_map:
      type: reflection
      axis_deg: 180.0
    sector_map: layer_exchange
    source_matrix_role: raw_h_sewing_action
    source_gauge: raw_saved_TAPW
    target_role: continuum_internal_rep
    gauge_correction:
      kind: none
    antiunitary_convention: U_K
    spin_map: from_kp_symm_output
    valley_map: identity
  exactification:
    support_source: geometry
    central_phase:
      C3z^3: -1
      C2T^2: 1
    phase_classes: global
    reject_if_off_support_rel_gt: 3.0e-06
    reject_if_amplitude_deviation_gt: 0.02
coordinate_frame:
  rotation_deg: 210
kpath:
  file: ../../../../tapw/KPATH.in
  tmat:
  - - 52.4951056667
    - 0.0
    - 0.0
  - - -26.247552834
    - 45.4620950821
    - 0.0
  - - 0.0
    - 0.0
    - 27.0
model:
  n_orb:
  - 1
  - 1
  bM:
    bM1:
    - 0.13820712168748003
    - 0.0
    bM2:
    - 0.06910356084374003
    - 0.11969087836528494
  harmonics:
    intra: 4
    inter: 4
  max_order:
    Kinect: 6
    intra: 4
    inter: 4
  symmetry_map:
    Kinect:
    - name: C3z
    - name: C2T
    Onsite:
    - name: C3z
    - name: C2T
    intra:
    - name: C3z
    - name: C2T
    inter:
    - name: C3z
    - name: C2T
fit:
  indices:
  - 0
  coeff_tol: 1.0e-06
bands:
  compare_to_heff: true
  band_slice:
  - 46
  - 54
  plot:
    top_bands: 8
    align: top
    figsize:
    - 3.0
    - 5.8
output:
  dir: ../../../outputs/model/production/mote2_3.89_K1
  save_coefficients: true
  verbose: false
  progress: true
