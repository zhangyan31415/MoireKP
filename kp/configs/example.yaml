# Example configuration for a material run (developer skeleton)

material:
  hamk_file: "/path/to/hamk.npy"
  qset1_file: "/path/to/g_vec_list_layer1.npy"
  qset2_file: "/path/to/g_vec_list_layer2.npy"
  orbital_order_file: "/path/to/orbital_order.csv"
  valley: "K1"
  spin: "all"
  q_shells: 6
  truncate_shells: 4
  num_layers: 2
  num_orb_per_layer: [76, 76]

experiment:
  energy_window: [-0.1, 0.1]
  fermi_ref: "auto"
  selection_score: "max"
  top_k: 6
  workers: 8
  symmetry_ops:
    Onsite: [{name: C3z, params: 1}]
    Kinect: [{name: C3z, params: 1}, {name: C3z, params: 2}, {name: C2yT}, {name: C2zT}]
    intra:  [{name: C3z, params: 1}, {name: C3z, params: 2}, {name: C2yT}, {name: C2zT}]
    inter:  [{name: C3z, params: 1}, {name: C3z, params: 2}, {name: C2yT}, {name: C2zT}]

