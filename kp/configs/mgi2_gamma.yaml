  spin: "all"
  num_layers: 2
  # Optional: provide per-layer orbitals; otherwise inferred
  # num_orb_per_layer: [46, 46]
  # Optional: orbital order string (not used in this plot step)
  orbital_order: "I-s3p2d2,Mg-s2p2,I-s3p2d2"

plot:
  hamk_index: 0
  target: "all"  # 'all' plots full spectrum; or 'valence'/'conduction'/band index
  ref_q_index: 0
  out: "plots_mgi2/mgi2_gamma_scatter.png"
  data_out: "plots_mgi2/mgi2_gamma_spectrum_8.txt"
  title: "MgI2 Gamma valley — VBM band vs Q"
  ylim: [-4, -1]
  sort_by_qnorm: true
  q_rotation_deg: 210
  report_below: 12
  report_above: 0
  report_components: 12


