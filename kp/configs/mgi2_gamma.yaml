material:
  name: MgI2
  hamk_file: "/data/work/zy/software/1.tapw_code/moirekp/kp/configs/8_3.89_mgi2/tapw/Q_shell_6/band/hamk_Gamma_valley.npy"
  qset1_file: "/data/work/zy/software/1.tapw_code/moirekp/kp/configs/8_3.89_mgi2/tapw/Q_shell_6/g_vec_list_6_Gamma_1layer.npy"
  qset2_file: "/data/work/zy/software/1.tapw_code/moirekp/kp/configs/8_3.89_mgi2/tapw/Q_shell_6/g_vec_list_6_Gamma_2layer.npy"
  # Precomputed band energies (fast path)
