material:
  name: MgI2
  spin: all
  num_layers: 2
  efermi: -4.168612
  orbital_order: I-s3p2d2,Mg-s2p2,I-s3p2d2
  hamk_file: ../../../tapw/Q_shell_7/band/hamk_M1_valley.npy
  qset1_file: ../../../tapw/Q_shell_7/g_vec_list_7_M1_1layer.npy
  qset2_file: ../../../tapw/Q_shell_7/g_vec_list_7_M1_2layer.npy
  band_file: ../../../tapw/Q_shell_7/band/band_CBM_M1_valley.txt

plot:
  mode: M1
  hamk_index: 0
  target: all
  ref_q_index: 30
  sort_by_qnorm: true
  report_below: 2
  report_above: 2
  report_components: 8
  ylim: [-1, 8]
  title: "MgI2 M1 spinful valley: CBM band vs Q"
  out: ../../outputs/plot/mgi2_3.89_M1_spinful/mgi2_M1_spinful_scatter.png
  data_out: ../../outputs/plot/mgi2_3.89_M1_spinful/mgi2_M1_spinful_spectrum.txt
  nlow_state_list:
  - [22, 23]
  - [22, 23]
  norb_fix_list:
  - - [19, 1.0]
    - [65, 1.0]
  - - [19, 1.0]
    - [65, 1.0]

project:
  enable: true
  mode: M1
  workers: 4
  out_dir: ../../outputs/project/mgi2_3.89_M1_spinful
  report_below: 8
  report_above: 8
  report_components: 10
  ylim: [-2.8, -2.1]
  e_ref: -2.6
  nlow_state_list:
  - [22, 23]
  - [22, 23]
  norb_fix_list:
  - - [19, 1.0]
    - [65, 1.0]
  - - [19, 1.0]
    - [65, 1.0]
  title: "MgI2 M1 spinful projected Heff"

symm:
  enable: true
  valley: M1
  spin: all
  tapw_symmetry_dir: ../../../tapw/symmetry_analysis_test_m_q7
  operations: [TR, C2]
  output_dir: ../../outputs/symm/mgi2_3.89_M1_spinful
  tolerance: 1.0e-2
