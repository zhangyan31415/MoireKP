case:
  profile: Gamma
  q_shell: q05
  output_root: ../outputs
title: MgI2 Gamma q05
valley: Gamma
spin: all

material:
  name: MgI2
  num_layer_list: [1, 1]
  orbital_order: I-s3p2d2,Mg-s2p2,I-s3p2d2
  efermi: -4.168612
  hamk_file: ../../tapw/outputs/Gamma/q05/band/hamiltonian_k.npy
  qset1_file: ../../tapw/outputs/Gamma/q05/band/g_vectors_group1.npy
  qset2_file: ../../tapw/outputs/Gamma/q05/band/g_vectors_group2.npy
  band_file: ../../tapw/outputs/Gamma/q05/band/energies_vbm.txt

plot:
  mode: gamma
  hamk_index: 0
  # Fast inspect path from band_file. Change to "all" to diagonalize hamk and
  # print orbital/eigenvector components.
  target: valence
  ref_q_index: 0
  sort_by_qnorm: true
  report_below: 12
  report_above: 0
  report_components: 12
  q_window_bands: 10
  ylim: [-2.0, 2.0]
  title: "MgI2 Gamma q05: VBM band vs Q"

project:
  nlow_state_list:
    - [40, 41]
    - [42, 43]
  gauge: auto
  downfold_method: fixed_schur
  e_ref: -5.75

symm:
  tapw_symmetry_dir: ../../tapw/outputs/Gamma/q05/symmetry
  tolerance: 1.0e-2

symm_rep:
  output_dir: symm_rep
  valence_count: 20
  conduction_count: 20
  degeneracy_tol: 2.0e-3
  points:
    Gamma: [0.0, 0.0]
    M: [0.5, 0.0]
    K: [0.3333333333, 0.3333333333]

kpath:
  labels: [G, M, K, G]
  points_per_segment: 40
  coordinates:
    G: [0.0, 0.0]
    M: [0.5, 0.0]
    K: [0.3333333333, 0.3333333333]
  tmat: [[60.9508659523, 0.0, 0.0], [-30.4754329751, 52.7849982976, 0.0], [0.0, 0.0, 50.0]]

model:
  n_orb: [2, 2]
  harmonics:
    intralayer: 4
    interlayer: 4
  max_order:
    kinetic: 10
    intralayer: 6
    interlayer: 10
  fit:
    indices: [0, 40]
    coeff_tol: 1.0e-6
    refine_bands:
      enabled: true
      solver: linear_low_subspace
      indices: [0, 2, 10, 20, 30, 40, 50, 60]
      top_bands: 10
      align: top
      variable_tags: [kinetic, onsite, intralayer]
      components: [real]
      regularization: 0.3
      weighted_band_loss:
        enabled: true
        primary_bands: 4
        decay: 0.75
        floor: 0.45
  bands:
    compare_to_heff: true
    band_slice: [0, 124]
    plot:
      top_bands: 10
      align: top
      figsize: [3.0, 5.0]
