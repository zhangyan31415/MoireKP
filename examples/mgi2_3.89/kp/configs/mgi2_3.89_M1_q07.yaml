case:
  profile: M1
  q_shell: q07
  output_root: ../outputs
title: MgI2 M1 q07
valley: M1
spin: all

material:
  name: MgI2
  num_layer_list: [1, 1]
  orbital_order: I-s3p2d2,Mg-s2p2,I-s3p2d2
  efermi: -4.168612
  hamk_file: ../../tapw/outputs/M1/q07/band/hamiltonian_k.npy
  qset1_file: ../../tapw/outputs/M1/q07/band/g_vectors_group1.npy
  qset2_file: ../../tapw/outputs/M1/q07/band/g_vectors_group2.npy
  band_file: ../../tapw/outputs/M1/q07/band/energies_cbm.txt

plot:
  mode: M1
  hamk_index: 0
  # Fast inspect path from band_file. Change to "all" to diagonalize hamk and
  # print orbital/eigenvector components.
  target: conduction
  ref_q_index: 30
  sort_by_qnorm: true
  report_below: 2
  report_above: 2
  report_components: 8
  q_window_bands: 10
  ylim: [-1.0, 1.0]
  title: "MgI2 M1 q07: CBM band vs Q"

project:
  nlow_state_list:
    - [22, 23]
    - [22, 23]
  gauge: auto
  downfold_method: fixed_schur
  e_ref: -2.6

symm:
  tapw_symmetry_dir: ../../tapw/outputs/M1/q07/symmetry
  tolerance: 1.0e-2

kpath:
  labels: [G, M, K, G]
  points_per_segment: 40
  coordinates:
    G: [0.0, 0.0]
    M: [0.5, 0.0]
    K: [0.3333333333, 0.3333333333]
  tmat: [[60.9508659523, 0.0, 0.0], [-30.4754329751, 52.7849982976, 0.0], [0.0, 0.0, 50.0]]

model:
  n_orb: [2, 2]
  harmonics:
    intralayer: 6
    interlayer: 2
  max_order:
    kinetic: 10
    intralayer: 4
    interlayer: 6
  fit:
    indices: [0, 20, 40, 60]
    coeff_tol: 1.0e-6
  bands:
    compare_to_heff: true
    band_slice: [0, 16]
    plot:
      bottom_bands: 8
      align: bottom
      figsize: [3.0, 5.0]
      num_bands: 16
