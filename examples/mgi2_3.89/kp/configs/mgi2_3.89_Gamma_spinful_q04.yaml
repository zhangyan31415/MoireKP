system:
  name: MgI2
  output: ../outputs/gamma_spinful
  tapw_output: ../../tapw/outputs
  layers: [1, 1]
  spin: all
  orbital_order: I-s3p2d2,Mg-s2p2,I-s3p2d2
  cell:
    - [60.9508659523, 0.0, 0.0]
    - [-30.4754329751, 52.7849982976, 0.0]
    - [0.0, 0.0, 50.0]

project:
  valley: Gamma
  q_shell: 4
  efermi: -4.168612
  target: valence
  nlow_state_list:
    - [40, 41]
    - [42, 43]
  downfold_method: fixed_schur
  e_ref: -5.74
  workers: 64

symmetry: {}

model:
  target_bands: top
  harmonics: {intralayer: 3, interlayer: 3}
  max_order:
    kinetic: 10
    intralayer: 6
    interlayer: 10
  fit:
    method: linear
    kpoints: [0, 40]
    bands: 10
    one_sided_weight: 0.0
    two_sided_weight: 0.0
  bands:
    compare_to_heff: true
    band_slice: [0, 76]
    plot:
      top_bands: 10
      align: top
      figsize: [3.0, 5.0]
