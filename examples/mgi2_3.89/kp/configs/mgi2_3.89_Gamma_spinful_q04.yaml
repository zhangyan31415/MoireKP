system:
  name: MgI2
  output: ../outputs/gamma_spinful
  tapw_output: ../../tapw/outputs
  layers: [1, 1]
  spin: all
  orbital_order: I-s3p2d2,Mg-s2p2,I-s3p2d2
  cell:
    - [60.9508659523, 0.0, 0.0]
    - [-30.4754329751, 52.7849982976, 0.0]
    - [0.0, 0.0, 50.0]

project:
  valley: Gamma
  q_shell: 4
  efermi: -4.168612
  target: valence
  selection: auto
  # Audited automatic result. Uncommenting this list makes selection explicit.
  # nlow_state_list:
  #   - [40, 41]
  #   - [42, 43]
  downfold_method: fixed_schur
  e_ref: -5.74
  workers: 64

symmetry: {}

bands:
  kpath:
    labels: [G, M, K, G]
    points_per_segment: 20
    coordinates:
      G: [0.0, 0.0]
      M: [0.5, 0.0]
      K: [0.3333333333, 0.3333333333]
  compare_to_heff: true
  band_slice: [0, 76]
  plot:
    top_bands: 10
    align: top
    figsize: [3.0, 5.0]

model:
  target_bands: top
  max_order:
    kinetic: 10
    intralayer: 6
    interlayer: 10
  fit:
    method: linear
    # Seven representative G-M-K-G rows make the unweighted response design
    # full rank for this higher-order MgI2 model.  This is the configuration
    # used for the main-text/publication result.
    kpoints: [0, 10, 20, 30, 40, 50, 60]
    bands: 10
    one_sided_weight: 0.0
    # Main-text choice: an unweighted full-Hamiltonian linear fit.
    two_sided_weight: 0.0
    # Optional low-energy-focused alternative: set two_sided_weight to 300.0.
    # With the same seven k rows, this improves the top-10-band RMS/Max against
    # the support-masked Heff from 0.651/2.071 meV to 0.047/0.254 meV, while
    # increasing the all-76-band RMS from 0.726 meV to 1.059 meV.  It remains
    # a linear fit; use it when the top low-energy bands are the priority.
