system:
  name: MgI2
  output: ../outputs/m1_spinless
  tapw_output: ../../tapw/outputs
  layers: [1, 1]
  spin: up
  orbital_order: I-s3p2d2,Mg-s2p2,I-s3p2d2
  cell:
    - [60.9508659523, 0.0, 0.0]
    - [-30.4754329753, 52.7849982976, 0.0]
    - [0.0, 0.0, 50.0]

project:
  valley: M1
  q_shell: 7
  efermi: -4.168612
  target: conduction
  selection: auto
  # Audited automatic result. Uncommenting this list makes selection explicit.
  # nlow_state_list:
  #   - [11]
  #   - [11]
  e_ref: -2.6
  workers: 64

symmetry: {}

bands:
  kpath:
    labels: [G, M, K, G]
    points_per_segment: 20
    coordinates:
      G: [0.0, 0.0]
      M: [0.5, 0.0]
      K: [0.3333333333, 0.3333333333]
  compare_to_heff: true
  band_slice: [0, 8]
  plot:
    bottom_bands: 8
    align: bottom
    figsize: [3.0, 5.0]
    ylim: [-0.01, 0.16]

model:
  target_bands: bottom
  max_order: {kinetic: 10, intralayer: 6, interlayer: 8}
  fit:
    method: linear
    kpoints: [20, 40]
    bands: 8
    one_sided_weight: 0.0
    two_sided_weight: 0.0
