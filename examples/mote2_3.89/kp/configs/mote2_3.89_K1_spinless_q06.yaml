system:
  name: MoTe2
  output: ../outputs/k1_spinless
  tapw_output: ../../tapw/outputs
  layers: [1, 1]
  spin: up
  orbital_order: Te-s3p2d2,Mo-s3p2d1,Te-s3p2d2
  cell:
    - [52.4951056667, 0.0, 0.0]
    - [-26.247552834, 45.4620950821, 0.0]
    - [0.0, 0.0, 27.0]

project:
  valley: K1
  q_shell: 6
  efermi: -4.1
  target: valence
  selection: auto
  # Audited automatic result. Uncommenting this list makes selection explicit.
  # nlow_state_list:
  #   - [22]
  #   - [22]
  e_ref: -4.6
  workers: 64

symmetry: {}

bands:
  kpath:
    labels: [G, M, K, G]
    points_per_segment: 20
    coordinates:
      G: [0.0, 0.0]
      M: [0.5, 0.0]
      K: [0.3333333333, 0.3333333333]
  compare_to_heff: true
  band_slice: [46, 54]
  plot:
    top_bands: 8
    align: top
    figsize: [3.0, 5.0]

model:
  target_bands: top
  max_order: {kinetic: 10, intralayer: 4, interlayer: 4}
  fit:
    method: linear
    kpoints: [0, 2]
    bands: 8
    one_sided_weight: 0.0
    two_sided_weight: 0.0
