# Paths are resolved relative to this YAML file.
material:
  name: MoTe2
  spin: up
  energy_unit: eV
  num_layers: 2
  efermi: -4.1
  orbital_order: Te-s3p2d2,Mo-s3p2d1,Te-s3p2d2
  hamk_file: ../../../tapw/Q_shell_6/band/hamk_K1_valley.npy
  qset1_file: ../../../tapw/Q_shell_6/g_vec_list_6_K1_1layer.npy
  qset2_file: ../../../tapw/Q_shell_6/g_vec_list_6_K1_2layer.npy
  band_file: ../../../tapw/Q_shell_6/band/band_VBM_K1_valley.txt

plot:
  mode: K1
  hamk_index: 0
  target: all
  ref_q_index: 0
  sort_by_qnorm: true
  report_below: 4
  report_above: 0
  report_components: 8
  ylim: [-6.2, 0]
  title: "MoTe2 K1 valley: VBM band vs Q"
  out: ../../outputs/plot/mote2_3.89_K1/mote2_k1_scatter.png
  data_out: ../../outputs/plot/mote2_3.89_K1/mote2_k1_spectrum.txt
  nlow_state_list:
    - [22]
    - [22]
  norb_fix_list:
    - - [[30, 1.0], [29, "-1j"]]
    - - [[30, 1.0], [29, "-1j"]]

project:
  mode: K1
  workers: 4
  downfold_method: fixed_schur
  e_ref: -4.575
  out_dir: ../../outputs/project/mote2_3.89_K1
  ylim: [-4.7, -4.5]
  verbose: false
  print_k_diagnostics: false
  nlow_state_list:
    - [22]
    - [22]
  norb_fix_list:
    - - [[30, 1.0], [29, "-1j"]]
    - - [[30, 1.0], [29, "-1j"]]

symm:
  enable: true
  valley: K1
  spin: up
  tapw_symmetry_dir: ../../../tapw/symmetry_analysis_test_k
  operations: [C3z, C2T]
  output_dir: ../../outputs/symm/mote2_3.89_K1
  tolerance: 2.0e-2
