case:
  profile: K1
  q_shell: q06
  output_root: ../outputs
title: MoTe2 K1 q06
valley: K1
spin: all

material:
  name: MoTe2
  num_layer_list: [1, 1]
  orbital_order: Te-s3p2d2,Mo-s3p2d1,Te-s3p2d2
  efermi: -4.1
  hamk_file: ../../tapw/Q_shell_6/band/hamk_K1_valley.npy
  qset1_file: ../../tapw/Q_shell_6/g_vec_list_6_K1_1layer.npy
  qset2_file: ../../tapw/Q_shell_6/g_vec_list_6_K1_2layer.npy
  band_file: ../../tapw/Q_shell_6/band/band_VBM_K1_valley.txt

project:
  nlow_state_list:
    - [44, 45]
    - [44, 45]
  gauge: auto
  downfold_method: fixed_schur
  e_ref: -4.575

symm:
  tapw_symmetry_dir: ../../tapw/symmetry_analysis_test_k
  tolerance: 2.0e-2

kpath:
  file: ../../tapw/KPATH.in
  tmat: [[52.4951056667, 0.0, 0.0], [-26.247552834, 45.4620950821, 0.0], [0.0, 0.0, 27.0]]

model:
  n_orb: [2, 2]
  harmonics:
    intralayer: 4
    interlayer: 4
  max_order:
    kinetic: 6
    intralayer: 4
    interlayer: 4
  fit:
    indices: [0]
    coeff_tol: 1.0e-6
  bands:
    compare_to_heff: true
    band_slice: [92, 108]
    plot:
      top_bands: 8
      align: top
      figsize: [3.0, 5.8]
      num_bands: 16
