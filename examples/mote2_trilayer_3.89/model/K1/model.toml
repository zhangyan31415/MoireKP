schema_version = "moirekp-physical-v1"
model_name = "count44_spin_up_projected"
energy_unit = "eV"
momentum_unit = "1/angstrom"

[polynomial]
complex_coordinate = "z_Q=(kx-Qx)+i*(ky-Qy)"
maximum_order = 6

[q_lattice]
b1 = [0.13952263441943036, -1.8982038163528614e-13]
b2 = [0.06976131720987958, 0.12083014581006088]
offset_gauge = "explicit_sector_offsets_v1"

[[sectors]]
id = "L1"
qset = "qset1"
q_offset = [0.06976131720977002, 0.04027671526995709]
number_of_orbitals = 2

[[sectors]]
id = "L2"
qset = "qset2"
q_offset = [1.0954964523760646e-13, 0.08055343054010392]
number_of_orbitals = 1

[validation]
lattice_tolerance = 1e-08

[runtime]
canonical_evaluator = "equation_17_integer_routes"
terms_file = "terms.csv"
default_q_points_file = "q_points.csv"
