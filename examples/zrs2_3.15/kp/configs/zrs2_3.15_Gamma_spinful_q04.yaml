system:
  name: ZrS2
  output: ../outputs/gamma_spinful
  tapw_output: ../../tapw/outputs
  layers: [1, 1]
  spin: all
  orbital_order: S-s2p2d1,Zr-s3p2d1,S-s2p2d1
  cell:
    - [66.7716403945, 0.0, 0.0]
    - [-33.3858201993, 57.8259368341, 0.0]
    - [0.0, 0.0, 22.9186134249]

project:
  valley: Gamma
  q_shell: 4
  efermi: -5.71
  target: valence
  nlow_state_list:
    - [40, 41, 42, 43]
    - [44, 45, 46, 47]
  downfold_method: fixed_schur
  e_ref: -6.21
  workers: 64

symmetry: {}

model:
  target_bands: top
  harmonics: {intralayer: 2, interlayer: 2}
  max_order: {kinetic: 8, intralayer: 2, interlayer: 3}
  fit:
    method: linear
    kpoints: [0, 20, 60]
    bands: 20
    one_sided_weight: 0.0
    two_sided_weight: 300.0
  bands:
    compare_to_heff: true
    band_slice: [0, 124]
    plot:
      top_bands: 10
      align: top
      figsize: [3.0, 5.0]
