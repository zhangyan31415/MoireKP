clean_clone_smoke:
  runtime_class: clean-clone
  description: >-
    These commands are expected to run from a clean source clone after installing
    the Python environment. They do not require pending external datasets.
  commands:
    - id: release-contract-tests
      command: python -m pytest tests/test_release_contract.py tests/kp/test_example_dependency_contract.py -q
      runtime_class: clean-clone
      expected_outputs:
        - Release metadata and manifest validation tests pass.
    - id: tapw-help
      command: tapw --help
      runtime_class: clean-clone
      expected_outputs:
        - TAPW CLI help exits with status 0.
    - id: tapw-init-help
      command: tapw init --help
      runtime_class: clean-clone
      expected_outputs:
        - TAPW init subcommand help exits with status 0.
    - id: kp-help
      command: kp --help
      runtime_class: clean-clone
      expected_outputs:
        - KP CLI help exits with status 0.
