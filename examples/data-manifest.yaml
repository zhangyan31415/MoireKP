  commands:
  - id: tapw_K
    command: tapw run -c examples/mote2_3.89/tapw/tapw_K.yaml && tapw symm -c examples/mote2_3.89/tapw/tapw_K.yaml
    runtime_class: external-data
    expected_outputs:
