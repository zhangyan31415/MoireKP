  - examples/mote2_aab_5.09/openmx/soc/S.npz
  - examples/mote2_aab_5.09/tapw/outputs
  - examples/ptse2_7.34/openmx/soc/H.npz
  - examples/ptse2_7.34/openmx/soc/S.npz
  - examples/ptse2_7.34/tapw/outputs
  - examples/zrs2_3.15/openmx/soc/H.npz
  - examples/zrs2_3.15/openmx/soc/S.npz
  - examples/zrs2_3.15/tapw/outputs
  - examples/zrs2_3.89/openmx/soc/H_symm.npz
  - examples/zrs2_3.89/openmx/soc/S_symm.npz
  - examples/zrs2_3.89/tapw/outputs
clean_clone_smoke:
  runtime_class: clean-clone
  description: Safe checks that do not require external scientific datasets.
  commands:
  - id: release-contract-tests
    command: python -m pytest tests/test_release_contract.py tests/kp/test_example_dependency_contract.py
      -q
    runtime_class: clean-clone
    expected_outputs:
    - Release contracts pass.
  - id: tapw-help
    command: tapw --help
    runtime_class: clean-clone
    expected_outputs:
    - TAPW CLI help exits with status 0.
  - id: kp-help
    command: kp --help
    runtime_class: clean-clone
    expected_outputs:
    - KP CLI help exits with status 0.
