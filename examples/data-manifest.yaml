schema_version: 2
status: pending
release_blockers:
- dataset_license
- doi
- data_url
metadata:
  license: null
  doi: null
  data_url: null
notes: The source release contains audited configs and small structural inputs for
  six material families. Dataset license, DOI, and public archive URL values must
  be supplied before an archival release. The software license does not automatically
  cover external OpenMX matrices or generated scientific data.
external_data:
  marker: pending_external
  description: Large first-principles H/S and the generated TAPW/KP arrays are supplied
    or regenerated locally; public archival metadata remains explicit.
  paths:
  - examples/mote2_3.89/openmx/H_symm.npz
  - examples/mote2_3.89/openmx/S_symm.npz
  - examples/mote2_3.89/output/tapw
  - examples/mote2_3.89/output/kp
  - examples/mote2_aab_5.09/openmx/H_symm.npz
  - examples/mote2_aab_5.09/openmx/S_symm.npz
  - examples/mote2_aab_5.09/output/tapw
  - examples/mote2_aab_5.09/output/kp
  - examples/zrs2_3.89/openmx/H_symm.npz
  - examples/zrs2_3.89/openmx/S_symm.npz
  - examples/zrs2_3.89/output/tapw
  - examples/zrs2_3.89/output/kp
clean_clone_smoke:
  runtime_class: clean-clone
  description: Safe checks that do not require external scientific datasets.
  commands:
  - id: tapw-help
    command: tapw --help
    runtime_class: clean-clone
    expected_outputs:
    - TAPW CLI help exits with status 0.
  - id: kp-help
    command: kp --help
    runtime_class: clean-clone
    expected_outputs:
    - KP CLI help exits with status 0.
