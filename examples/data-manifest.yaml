schema_version: 2
status: pending
release_blockers:
  - license
  - doi
  - data_url
metadata:
  license: null
  doi: null
  data_url: null
notes: >-
  Release dataset metadata is not finalized. Do not publish an archival release
  until every dataset has confirmed license, DOI, and public data URL values.
  Pending external entries describe files or generated artifact directories that
  are intentionally absent from a clean source clone.
external_data:
  marker: pending_external
  description: >-
    A clean clone contains tracked configs and small template inputs only. Large
    OpenMX matrices, TAPW Q-shell arrays, TAPW symmetry-analysis exports, and
    precomputed KP outputs are external data until a public archive URL and
    release DOI are assigned.
  paths:
    - examples/tapw/mote2_9.43/openmx/soc/H.npz
    - examples/tapw/mote2_9.43/openmx/soc/S.npz
    - examples/tapw/mgi2_9.43/openmx/soc/H.npz
    - examples/tapw/mgi2_9.43/openmx/soc/S.npz
    - examples/mote2_3.89/tapw/KPATH.in
    - examples/mote2_3.89/tapw/outputs/K1/q06/band
    - examples/mote2_3.89/tapw/outputs/K1/q06/symmetry
    - examples/mote2_3.89/kp/outputs/K1/q06/projection
    - examples/mote2_3.89/kp/outputs/K1_up/q06/projection
    - examples/mote2_3.89/kp/outputs/K1/q06/symmetry
    - examples/mote2_3.89/kp/outputs/K1_up/q06/symmetry
    - examples/mgi2_3.89/tapw/KPATH.in
    - examples/mgi2_3.89/tapw/outputs/Gamma/q05/band
    - examples/mgi2_3.89/tapw/outputs/M1/q07/band
    - examples/mgi2_3.89/tapw/outputs/Gamma/q05/symmetry
    - examples/mgi2_3.89/tapw/outputs/M1/q07/symmetry
