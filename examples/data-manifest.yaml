schema_version: 2
status: pending
release_blockers:
  - dataset_license
  - doi
  - data_url
metadata:
  license: null
  doi: null
  data_url: null
notes: >-
  The source release contains audited configs and small structural inputs for
  five material families. Dataset license, DOI, and public archive URL values
  must be supplied before an archival release. The software license does not
  automatically cover external OpenMX matrices or generated scientific data.
external_data:
  marker: pending_external
  description: >-
    Large OpenMX H/S matrices and generated TAPW/KP arrays are intentionally
    absent from a clean source clone and will be provided by the public data
    archive once its provenance metadata is finalized.
  paths:
    - examples/mote2_3.89/openmx/soc/H.npz
    - examples/mote2_3.89/openmx/soc/S.npz
    - examples/mote2_3.89/tapw/outputs
    - examples/mgi2_3.89/openmx/soc/H.npz
    - examples/mgi2_3.89/openmx/soc/S.npz
    - examples/mgi2_3.89/tapw/outputs
    - examples/mote2_aab_5.09/openmx/soc/H.npz
    - examples/mote2_aab_5.09/openmx/soc/S.npz
    - examples/mote2_aab_5.09/tapw/outputs
    - examples/ptse2_7.34/openmx/soc/H.npz
    - examples/ptse2_7.34/openmx/soc/S.npz
    - examples/ptse2_7.34/tapw/outputs
    - examples/zrs2_3.15/openmx/soc/H.npz
    - examples/zrs2_3.15/openmx/soc/S.npz
    - examples/zrs2_3.15/tapw/outputs
clean_clone_smoke:
  runtime_class: clean-clone
  description: Safe checks that do not require external scientific datasets.
  commands:
    - id: release-contract-tests
      command: python -m pytest tests/test_release_contract.py tests/kp/test_example_dependency_contract.py -q
      runtime_class: clean-clone
      expected_outputs:
        - Release contracts pass.
    - id: tapw-help
      command: tapw --help
      runtime_class: clean-clone
      expected_outputs:
        - TAPW CLI help exits with status 0.
    - id: kp-help
      command: kp --help
      runtime_class: clean-clone
      expected_outputs:
        - KP CLI help exits with status 0.
datasets:
  - id: mote2-3.89-k
    path: examples/mote2_3.89
    description: Bilayer MoTe2 K1 q06 spinful TAPW input and spinful/spinless automatic KP models.
    runtime_class: external-data
    license: null
    doi: null
    data_url: null
    required_files:
      - path: examples/mote2_3.89/tapw/configs/mote2_3.89_K1_spinful_q06.yaml
        kind: file
        size_bytes: 816
        sha256: 9bcc979f80821c5c281b3cb71724204481005e9315633a5722e2df55672d76af
      - path: examples/mote2_3.89/kp/configs/mote2_3.89_K1_spinful_q06.yaml
        kind: file
        size_bytes: 1023
        sha256: 63027d8d5d2131b0f4d5f1d070d7e2b126d5a84682fb86cda34ae7b5c40106c8
      - path: examples/mote2_3.89/kp/configs/mote2_3.89_K1_spinless_q06.yaml
        kind: file
        size_bytes: 995
        sha256: e82e01c6f5e658c1fede6bc8ed2dc34efabcc823958b24ccf30f5cc7910a1688
      - path: examples/mote2_3.89/openmx/soc/H.npz
        kind: file
        external: {marker: pending_external, reason: Large OpenMX Hamiltonian is not tracked.}
      - path: examples/mote2_3.89/openmx/soc/S.npz
        kind: file
        external: {marker: pending_external, reason: Large OpenMX overlap matrix is not tracked.}
    commands:
      - id: tapw-k1-spinful
        command: tapw run -c examples/mote2_3.89/tapw/configs/mote2_3.89_K1_spinful_q06.yaml && tapw symm -c examples/mote2_3.89/tapw/configs/mote2_3.89_K1_spinful_q06.yaml
        runtime_class: external-data
        expected_outputs:
          - {path: examples/mote2_3.89/tapw/outputs/K1/q06/band/hamiltonian_k.npy, status: generated}
          - {path: examples/mote2_3.89/tapw/outputs/K1/q06/symmetry, status: generated}
      - id: kp-k1-spinful
        command: kp project -c examples/mote2_3.89/kp/configs/mote2_3.89_K1_spinful_q06.yaml && kp symm -c examples/mote2_3.89/kp/configs/mote2_3.89_K1_spinful_q06.yaml && kp model -c examples/mote2_3.89/kp/configs/mote2_3.89_K1_spinful_q06.yaml
        runtime_class: external-data
        expected_outputs:
          - {path: examples/mote2_3.89/kp/outputs/k1_spinful/K1/q06/model/model_data.npz, status: generated}
      - id: kp-k1-spinless
