schema_version: 2
status: pending
release_blockers:
- dataset_license
- doi
- data_url
metadata:
  license: null
  doi: null
  data_url: null
notes: The source release contains audited configs and small structural inputs for
  six material families. Dataset license, DOI, and public archive URL values must
  be supplied before an archival release. The software license does not automatically
  cover external OpenMX matrices or generated scientific data.
external_data:
  marker: pending_external
  description: Large OpenMX H/S matrices and generated TAPW/KP arrays are intentionally
    absent from a clean source clone and will be provided by the public data archive
    once its provenance metadata is finalized.
  paths:
  - examples/mote2_3.89/openmx/soc/H.npz
  - examples/mote2_3.89/openmx/soc/S.npz
  - examples/mote2_3.89/tapw/outputs
  - examples/mgi2_3.89/openmx/soc/H.npz
  - examples/mgi2_3.89/openmx/soc/S.npz
  - examples/mgi2_3.89/tapw/outputs
