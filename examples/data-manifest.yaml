status: pending
release_blockers:
  - license
  - doi
  - data_url
metadata:
  license: null
  doi: null
  data_url: null
notes: >-
  Release dataset metadata is not finalized. Do not publish an archival release
  until every dataset has confirmed license, DOI, and public data URL values.
  Pending external entries describe files or generated artifact directories that
  are intentionally absent from a clean source clone.
external_data:
  marker: pending_external
  description: >-
    A clean clone contains tracked configs and small template inputs only. Large
    OpenMX matrices, TAPW Q-shell arrays, TAPW symmetry-analysis exports, and
    precomputed KP outputs are external data until a public archive URL and
    release DOI are assigned.
