system:
  name: 1+2 A-AB MoTe2 B
  output: ../outputs/k1_b
  tapw_output: ../../tapw/outputs
  layers: [1, 2]
  spin: up
  orbital_order: Te-s3p2d2,Mo-s3p2d1,Te-s3p2d2
  cell:
    - [40.0469757906, 0.0, 0.0]
    - [-20.0234878953, 34.6816948077, 0.0]
    - [0.0, 0.0, 27.0]

project:
  valley: K1
  q_shell: 4
  efermi: -4.182383738673
  target: valence
  selection: auto
  # Audited automatic result. Uncommenting this list makes selection explicit.
  # nlow_state_list:
  #   - []
  #   - []
  #   - [22]
  e_ref: -4.55
  workers: 64

symmetry: {}

bands:
  kpath:
    labels: [G, M, K, G]
    points_per_segment: 20
    coordinates:
      G: [0.0, 0.0]
      M: [0.5, 0.0]
      K: [0.3333333333, 0.3333333333]
  compare_to_heff: true
  band_slice: [0, 18]
  plot:
    top_bands: 8
    align: top
    figsize: [3.2, 5.8]
    ylim: [-0.36, 0.04]

model:
  target_bands: top
  max_order: {kinetic: 12, intralayer: 2, interlayer: 0}
  fit:
    method: linear
    kpoints: [0, 10, 20, 30, 40, 50, 60]
    bands: 8
    one_sided_weight: 0.0
    two_sided_weight: 0.0
