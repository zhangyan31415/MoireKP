project:
  mode: Gamma
  target: valence
  selection:
    mode: explicit
  nlow_state_list:
  - - 0
    - 1
    - 2
    - 3
    - 4
    - 5
  - []
  norb_fix_list:
  - - 0
    - 1
    - 2
    - 6
    - 7
    - 8
  - []
  downfold_method: first_order
  workers: 16
  blas_threads: 2
  out_dir: ../output/kp/Gamma/q05/projection
