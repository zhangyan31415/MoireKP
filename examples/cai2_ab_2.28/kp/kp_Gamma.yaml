case:
  profile: Gamma
  q_shell: q05
  output_root: ../output/kp
valley: Gamma
spin: all
material:
  name: CaI2 projected six-state molecular Heff
  num_layer_list:
  - 1
  - 1
  num_orb_per_layer:
  - 3
  hamk_file: ../input/Gamma/hamiltonian_k.npy
  kpoints_file: ../input/Gamma/kpoints.npy
