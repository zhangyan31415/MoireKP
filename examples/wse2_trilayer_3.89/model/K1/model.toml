schema_version = "moirekp-physical-v1"
model_name = "count43_spin_up_projected"
energy_unit = "eV"
momentum_unit = "1/angstrom"

[polynomial]
complex_coordinate = "z_Q=(kx-Qx)+i*(ky-Qy)"
maximum_order = 6

[q_lattice]
b1 = [0.14972584052994134, -2.0367041386748497e-13]
b2 = [0.0748629202651471, 0.12966638150180507]
offset_gauge = "explicit_sector_offsets_v1"

[[sectors]]
id = "L1"
qset = "qset1"
q_offset = [0.07486292026502953, 0.04322212716720052]
number_of_orbitals = 2

[[sectors]]
id = "L2"
qset = "qset2"
q_offset = [1.1756255655093553e-13, 0.08644425433460468]
number_of_orbitals = 1

[validation]
lattice_tolerance = 1e-08

[runtime]
canonical_evaluator = "equation_17_integer_routes"
terms_file = "terms.csv"
default_q_points_file = "q_points.csv"
