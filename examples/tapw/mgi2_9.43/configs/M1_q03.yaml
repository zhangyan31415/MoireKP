case:
  output_root: ../outputs

twist:
  bravais: hex
  spin: true
  twist_index_m: 3
  twist_layer: [1, 1]

paths:
  H_file: ../openmx/soc/H.npz
  S_file: ../openmx/soc/S.npz
  input_file: ../openmx/soc/openmx.dat_rigid

bands:
  valley: M1
  q_shell: 3
  efermi: -4.093002
  num_processes: 4
  blas_threads: 0
  num_bands: 20
  save_hamiltonian: true
  save_wavefunctions: true
  kpath:
    labels: [G, M, K, G]
    points_per_segment: 40
    coordinates:
      G: [0.0, 0.0]
      M: [0.5, 0.0]
      K: [0.3333333333, 0.3333333333]

symmetry:
  valley: M1
  q_shell: 3

topology:
  valley: M1
  q_shell: 3
  mesh:
    n_b1: 21
    n_b2: 21
    range_b1: [-0.5, 0.5]
    range_b2: [-0.5, 0.5]
  bands:
    vbm2:
      sector: valence
      indices: [-1, -2]
  berry_curvature:
    - bands: vbm2
  quantum_geometry:
    - bands: vbm2
  wcc:
    - bands: vbm2
      loop: b2

field:
  zero_potential_layers: [1]
  electric_field_eVpA: 0.0
  inner_symmetric: false
