system:
  name: ZrS2
  output: ../outputs_gmkg_unweighted/gamma_spinful
  tapw_output: ../../tapw/outputs_gmkg_km_neighbors
  layers: [1, 1]
  spin: all
  orbital_order: S-s2p2d1,Zr-s3p2d1,S-s2p2d1
  cell:
    - [54.0532327003, 0.0, 0.0]
    - [-27.0266163518, 46.8114726752, 0.0]
    - [0.0, 0.0, 22.9186134249]

project:
  valley: Gamma
  q_shell: 4
  efermi: -5.71304
  target: valence
  selection: auto
  downfold_method: fixed_schur
  e_ref: -6.21
  workers: 64

symmetry: {}

bands:
  kpath:
    labels: [G, M, K, G]
    points_per_segment: 20
    coordinates:
      G: [0.0, 0.0]
      M: [0.5, 0.0]
      K: [0.3333333333, 0.3333333333]
  compare_to_heff: true
  band_slice: [0, 124]
  plot:
    top_bands: 10
    align: top
    figsize: [3.0, 5.0]

model:
  target_bands: top
  max_order: {kinetic: 8, intralayer: 2, interlayer: 3}
  fit:
    method: linear
    kpoints: [0, 40, 50]
    bands: 20
    one_sided_weight: 0.0
    two_sided_weight: 0.0
