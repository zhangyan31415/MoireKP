system:
  output: output/tapw
  structure: POSCAR_rigid
  hamiltonian: H_symm.npz
  overlap: S_symm.npz
  orbitals:
    Zr: s3p2d1
    S: s2p2d1
  twist_index: 8
  layers: [1, 1]
  spin: true
bands:
  valley: Gamma
  q_shell: 4
  efermi: -5.71304
  num_processes: 4
  blas_threads: 1
  num_bands: 100
  save_hamiltonian: true
  save_wavefunctions: false
  kpath:
    labels:
    - G
    - M
    - K
    - G
    points_per_segment: 20
    coordinates:
      G:
      - 0.0
      - 0.0
      M:
      - 0.5
      - 0.0
      K:
      - 0.3333333333
      - 0.3333333333
symmetry:
  valley: Gamma
  q_shell: 4
  efermi: -5.71304
  num_processes: 4
  blas_threads: 1
  tolerance: 0.01
  spglib_symprec: 0.5
  representation:
    points:
      G:
      - 0.0
      - 0.0
      M:
      - 0.5
      - 0.0
      K:
      - 0.3333333333
      - 0.3333333333
    degeneracy_tol: 0.002
topology:
  valley: Gamma
  q_shell: 4
  save_wavefunctions: true
  mesh:
    n_b1: 41
    n_b2: 41
    range_b1:
    - -0.5
    - 0.5
    range_b2:
    - -0.5
    - 0.5
  bands:
    top2:
      sector: valence
      indices:
      - -2
      - -1
  berry_curvature:
  - bands: top2
  wcc:
  - bands: top2
    loop: b2
field:
  zero_potential_layers:
  - 1
  electric_field_eVpA: 0.0
  inner_symmetric: false
