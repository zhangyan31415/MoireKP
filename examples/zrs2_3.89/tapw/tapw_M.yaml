system:
  output: ../output/tapw
  structure: ../openmx/POSCAR_rigid
  hamiltonian: ../openmx/H_symm.npz
  overlap: ../openmx/S_symm.npz
  orbitals:
    Zr: s3p2d1
    S: s2p2d1
  twist_index: 8
  layers: [1, 1]
  spin: true
bands:
  valley: M1
  q_shell: 7
  efermi: -5.71304
  num_processes: 61
  blas_threads: 0
  num_bands: 160
  save_hamiltonian: true
  save_wavefunctions: false
  kpath:
    labels: [G, M, K, G]
    points_per_segment: 20
    coordinates:
      G: [0.0, 0.0]
      M: [0.5, 0.0]
      K: [0.3333333333, 0.3333333333]

symmetry:
  valley: M1
  q_shell: 7
  tolerance: 1.0e-2
  spglib_symprec: 5.0e-1
  debug: false
  developer_outputs: false

topology:
  valley: M1
  q_shell: 7
  save_wavefunctions: true
  mesh:
    n_b1: 31
    n_b2: 31
    range_b1: [-0.5, 0.5]
    range_b2: [-0.5, 0.5]
  bands:
    cbm1:
      sector: conduction
      indices: [0]
  berry_curvature:
    - bands: cbm1

field:
  zero_potential_layers: [1]
  electric_field_eVpA: 0.0
  inner_symmetric: false
