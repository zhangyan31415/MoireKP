[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moirekp"
version = "0.1.0"
description = "TAPW workflows and moire k.p model construction."
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER", "COPYRIGHT"]
requires-python = ">=3.11"
dependencies = [
    "ase>=3.22.0",
    "joblib>=1.0.0",
    "matplotlib>=3.4.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "psutil>=5.8.0",
    "pyyaml>=5.4.0",
    "scikit-learn>=0.24.0",
    "scipy>=1.7.0",
    "spglib>=2.0.0",
    "sympy>=1.13.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
siesta = [
    "sisl>=0.16,<0.18",
]
slepc = [
    "petsc4py",
    "slepc4py",
]

[project.scripts]
kp = "kp.cli:main"
tapw = "tapw.cli:main"

[tool.setuptools.packages.find]
where = ["kp", "tapw"]
include = ["kp*", "tapw*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
tapw = ["templates/*.yaml", "templates/*.in"]

[tool.setuptools.data-files]
"share/moirekp/docs" = ["docs/abacus_input.md"]
"share/moirekp/scripts" = ["scripts/README.md", "scripts/README.zh.md"]
"share/moirekp/scripts/openmx" = ["scripts/openmx/*.py", "scripts/openmx/*.cpp", "scripts/openmx/*.sh", "scripts/openmx/README.md"]
"share/moirekp/scripts/abacus" = ["scripts/abacus/prepare_hs.py", "scripts/abacus/README.md"]
"share/moirekp/scripts/abacus/_vendor" = ["scripts/abacus/_vendor/analysis_abacus.py", "scripts/abacus/_vendor/LICENSE.GPL-3.0", "scripts/abacus/_vendor/NOTICE.md"]
"share/moirekp/scripts/siesta" = ["scripts/siesta/*.py", "scripts/siesta/README.md"]
"share/moirekp/scripts/common" = ["scripts/common/*.py", "scripts/common/README.md"]
"share/moirekp/scripts/legacy" = ["scripts/legacy/README.md"]
"share/moirekp/scripts/legacy/openmx" = ["scripts/legacy/openmx/*.py"]

[tool.moirekp.release]
release_blockers = ["dataset_license", "doi", "data_url"]
