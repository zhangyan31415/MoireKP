[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moirekp"
version = "0.1.0"
description = "TAPW workflows and moire k.p model construction."
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER", "COPYRIGHT"]
requires-python = ">=3.11"
dependencies = [
    "ase>=3.22.0",
    "joblib>=1.0.0",
    "matplotlib>=3.4.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "psutil>=5.8.0",
    "pyyaml>=5.4.0",
    "scikit-learn>=0.24.0",
    "scipy>=1.7.0",
    "spglib>=2.0.0",
    "sympy>=1.13.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
slepc = [
    "petsc4py",
    "slepc4py",
]

[project.scripts]
kp = "kp.cli:main"
tapw = "tapw.cli:main"

[tool.setuptools.packages.find]
where = ["kp", "tapw"]
include = ["kp*", "tapw*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
tapw = ["templates/*.yaml", "templates/*.in"]
