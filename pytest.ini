[pytest]
testpaths =
    tests/test_release_contract.py
    tests/kp
    tests/tapw/test_artifacts.py
    tests/tapw/test_c3_symm_valleys.py
    tests/tapw/test_chern_post_geometry.py
    tests/tapw/test_cli_surface.py
    tests/tapw/test_config_paths.py
    tests/tapw/test_m_valley_band_reuse.py
    tests/tapw/test_sparse_cache_helpers.py
    tests/tapw/test_structure_input.py
    tests/tapw/test_symmetry_analysis_config.py
    tests/tapw/test_symmetry_analysis_main.py
    tests/tapw/test_symmetry_analysis_runner_outputs.py
    tests/tapw/test_symmetry_analysis_transport.py
    tests/tapw/test_tapw_chern_workflow.py
    tests/tapw/test_workflow_structure_wiring.py
markers =
    slow: long-running tests that are not part of the default release check
    external_data: tests that require non-repository TAPW/kp datasets
    requires_openmx: tests that require OpenMX inputs
    requires_mpi: tests that require MPI runtime support
    requires_slepc: tests that require SLEPc/PETSc
norecursedirs =
    .git
    .pytest_cache
    __pycache__
    build
    dist
    paper
    review_bundles
    review_outputs
    review_packages
    context
    .worktrees
