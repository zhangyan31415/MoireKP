[pytest]
# Local research test depends on the unshipped kp.experimental module.
addopts = --ignore=tests/kp/test_fixed_spin.py
testpaths =
    tests/test_release_contract.py
    tests/kp
    tests/tapw
markers =
    slow: long-running numerical tests
    external_data: requires scientific inputs not contained in the source checkout
    requires_openmx: requires OpenMX inputs or reader
    requires_mpi: requires MPI runtime support
    requires_slepc: requires SLEPc/PETSc
norecursedirs =
    .git
    __pycache__
    build
    dist
    paper
    reports
    .worktrees
