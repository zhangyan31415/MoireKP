[pytest]
testpaths =
    tests/kp
    tests/tapw/test_sparse_cache_helpers.py
    tests/tapw/test_parallel_policy.py
    tests/tapw/test_symmetry_analysis_math.py
    tests/tapw/test_symmetry_analysis_config.py
markers =
    slow: long-running tests that are not part of the default release check
    external_data: tests that require non-repository TAPW/kp datasets
    requires_openmx: tests that require OpenMX inputs
    requires_mpi: tests that require MPI runtime support
    requires_slepc: tests that require SLEPc/PETSc
norecursedirs =
    .git
    .pytest_cache
    __pycache__
    build
    dist
    paper
    review_bundles
    review_outputs
    review_packages
    context
    .worktrees
